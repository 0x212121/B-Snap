[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "b-snap"
version = "2.4.0"
description = "Self-hosted web-based application to capture, manage, and monitor snapshots from ONVIF-enabled or RTSP-compatible IP cameras"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Indra W.", email = "wijaya.indra2196@gmail.com"}
]
keywords = ["cctv", "camera", "snapshot", "onvif", "rtsp", "monitoring", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Topic :: Multimedia :: Video",
]

dependencies = [
    "fastapi>=0.116.0",
    "uvicorn[standard]>=0.35.0",
    "gunicorn>=23.0.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.16.0",
    "psycopg2-binary>=2.9.10",
    "asyncpg>=0.30.0",
    "pydantic>=2.11.0",
    "python-multipart>=0.0.20",
    "jinja2>=3.1.6",
    "aiofiles>=24.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=3.2.2",
    "pyotp>=2.9.0",
    "qrcode>=8.2",
    "pillow>=11.0.0",
    "opencv-python>=4.12.0",
    "numpy>=2.2.0",
    "onvif-zeep>=0.2.12",
    "requests>=2.32.0",
    "APScheduler>=3.11.0",
    "ping3>=4.0.8",
    "python-dotenv>=1.0.0",
    "psutil>=7.0.0",
    "cachetools>=6.2.0",
    "concurrent-log-handler>=0.9.0",
    "websockets>=15.0.0",
    "orjson>=3.11.0",
    "markdown>=3.8.0",
    "itsdangerous>=2.2.0",
    "reportlab>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.6.0",
    "httpx>=0.28.0",
    "factory-boy>=3.3.0",
    "faker>=33.0.0",
    "freezegun>=1.5.0",
    "responses>=0.25.0",
    "asgi-lifespan>=2.1.0",
]
lint = [
    "ruff>=0.8.0",
    "black>=24.10.0",
    "mypy>=1.14.0",
    "bandit[toml]>=1.8.0",
    "pre-commit>=4.0.0",
]
docs = [
    "sphinx>=8.0.0",
    "sphinx-rtd-theme>=3.0.0",
    "sphinxcontrib-openapi>=0.8.0",
    "myst-parser>=4.0.0",
    "sphinx-book-theme>=1.1.0",
]
test = [
    "coverage[toml]>=7.6.0",
    "pytest-html>=4.1.0",
    "pytest-mock>=3.14.0",
]

[project.urls]
Homepage = "https://github.com/0x212121/b-snap"
Documentation = "https://github.com/0x212121/b-snap/docs"
Repository = "https://github.com/0x212121/b-snap.git"
Issues = "https://github.com/0x212121/b-snap/issues"
Changelog = "https://github.com/0x212121/b-snap/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*", "docs*"]

# =============================================================================
# BLACK - Code Formatter
# =============================================================================
[tool.black]
line-length = 100
target-version = ['py311', 'py312', 'py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | migrations
  | alembic/versions
)/
'''
skip-string-normalization = false
preview = false

# =============================================================================
# RUFF - Fast Python Linter
# =============================================================================
[tool.ruff]
target-version = "py311"
line-length = 100
indent-width = 4

[tool.ruff.lint]
select = [
    # Pyflakes
    "F",
    # Pycodestyle
    "E", "W",
    # isort
    "I",
    # pep8-naming
    "N",
    # pydocstyle
    "D",
    # flake8-bugbear
    "B",
    # flake8-comprehensions
    "C4",
    # flake8-simplify
    "SIM",
    # pyupgrade
    "UP",
    # mccabe
    "C90",
    # flake8-return
    "RET",
    # flake8-unused-arguments
    "ARG",
    # pylint
    "PL",
    # flake8-pytest-style
    "PT",
    # flake8-django (jika pakai Django, tapi tetap useful untuk ORM patterns)
    "DJ",
    # flake8-fastapi
    "FAST",
    # Perflint
    "PERF",
    # Ruff-specific rules
    "RUF",
]
ignore = [
    "D100",  # Missing docstring in public module
    "D104",  # Missing docstring in public package
    "D105",  # Missing docstring in magic method
    "D107",  # Missing docstring in __init__
    "D203",  # 1 blank line required before class docstring
    "D212",  # Multi-line docstring summary should start at the first line
    "D213",  # Multi-line docstring summary should start at the second line
    "D400",  # First line should end with a period
    "D401",  # First line should be in imperative mood
    "D415",  # First line should end with a period, question mark, or exclamation point
    "E501",  # Line too long (handled by black)
    "B008",  # Do not perform function calls in argument defaults
    "RUF012",  # Mutable class attributes should be annotated with `typing.ClassVar`
    "SIM102",  # Use a single if-statement instead of nested if-statements
    "PLR0913",  # Too many arguments to function call
    "PLR2004",  # Magic value used in comparison
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Test files
"app/tests/**/*.py" = [
    "D",  # Ignore docstring rules in tests
    "S",  # Ignore security rules in tests (bandit)
    "PLR2004",  # Magic values
    "ARG001",  # Unused function args (fixtures)
]
"alembic/versions/*.py" = [
    "D",  # Migration files don't need docstrings
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# =============================================================================
# MYPY - Static Type Checker
# =============================================================================
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = true
follow_imports = "silent"
show_error_codes = true
show_column_numbers = true
pretty = true

# Ignore third-party libraries without type stubs
[[tool.mypy.overrides]]
module = [
    "onvif.*",
    "zeep.*",
    "cv2.*",
    "ping3.*",
    "apscheduler.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "app.tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

# =============================================================================
# PYTEST - Testing Framework
# =============================================================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["app/tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    "-ra",
    "-q",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-report=xml:coverage.xml",
    "--cov-branch",
    "--cov-fail-under=70",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow tests",
    "camera: Tests that require camera connection",
    "database: Tests that require database",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# =============================================================================
# COVERAGE - Test Coverage
# =============================================================================
[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/migrations/*",
    "*/alembic/*",
    "*/venv/*",
    "*/.venv/*",
    "*/env/*",
    "app/main.py",  # Entry point
]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    'class .*\\bProtocol\\):',
    '@(abc\\.)?abstractmethod',
    "pass",
    "\\.\\.\\.",
]
precision = 2
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

# =============================================================================
# BANDIT - Security Linter
# =============================================================================
[tool.bandit]
exclude_dirs = [
    "app/tests",
    "alembic",
    ".venv",
    "venv",
]
skips = ["B101"]  # assert_used - acceptable in FastAPI

# =============================================================================
# ISORT - Import Sorting (dihandle oleh ruff, tapi tetap di-config)
# =============================================================================
[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["fastapi", "pydantic", "sqlalchemy"]
combine-as-imports = true
split-on-trailing-comma = false
lines-between-types = 1
