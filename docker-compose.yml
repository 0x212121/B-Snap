# All application services consume the exact same image reference.
x-bsnap-image: &bsnap-image ${BSNAP_IMAGE:-kpcsgt-registry.kpc.co.id/kpc-private/b-snap:v2.4.0}

x-container-logging: &container-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "5"

services:
  migrate:
    logging: *container-logging
    cpus: "${MIGRATE_CPUS:-1.0}"
    mem_limit: "${MIGRATE_MEM_LIMIT:-512m}"
    stop_grace_period: "${MIGRATE_STOP_GRACE_PERIOD:-60s}"
    init: true
    environment:
      DB_POOL_SIZE: "${MIGRATE_DB_POOL_SIZE:-2}"
      DB_MAX_OVERFLOW: "0"
      DB_POOL_TIMEOUT: "${DB_POOL_TIMEOUT:-5}"
      DB_POOL_RECYCLE: "${DB_POOL_RECYCLE:-1800}"
    image: *bsnap-image
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
    command: ["/app/start.sh", "migrate"]
    restart: "no"

  b-snap:
    logging: *container-logging
    cpus: "${WEB_CPUS:-2.0}"
    mem_limit: "${WEB_MEM_LIMIT:-2g}"
    stop_grace_period: "${WEB_STOP_GRACE_PERIOD:-120s}"
    init: true
    environment:
      DB_POOL_SIZE: "${WEB_DB_POOL_SIZE:-5}"
      DB_MAX_OVERFLOW: "${WEB_DB_MAX_OVERFLOW:-5}"
      WEB_CONCURRENCY: "${WEB_CONCURRENCY:-${WORKERS:-2}}"
      GRACEFUL_TIMEOUT: "${GRACEFUL_TIMEOUT:-90}"
      BIND: "0.0.0.0:8080"
      DB_POOL_TIMEOUT: "${DB_POOL_TIMEOUT:-5}"
      DB_POOL_RECYCLE: "${DB_POOL_RECYCLE:-1800}"
    build: .
    image: *bsnap-image
    container_name: bsnap-app
    ports:
      - "8080:8080"
    privileged: false
    cap_add:
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./static/snapshots:/app/static/snapshots
      - ./static/videos:/app/static/videos
      - ./logs:/app/logs
      - ./archives/audit_logs:/app/archives/audit_logs
      - shared_tmp:/tmp/shared
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "12", "http://127.0.0.1:8080/readyz"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
    # command: gunicorn app.main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8080 --workers 2 --worker-connections 1000 --timeout 60 --keep-alive 2

  scheduler:
    logging: *container-logging
    cpus: "${SCHEDULER_CPUS:-2.0}"
    mem_limit: "${SCHEDULER_MEM_LIMIT:-4g}"
    stop_grace_period: "${SCHEDULER_STOP_GRACE_PERIOD:-180s}"
    init: true
    environment:
      DB_POOL_SIZE: "${SCHEDULER_DB_POOL_SIZE:-10}"
      DB_MAX_OVERFLOW: "${SCHEDULER_DB_MAX_OVERFLOW:-5}"
      DB_POOL_TIMEOUT: "${DB_POOL_TIMEOUT:-5}"
      DB_POOL_RECYCLE: "${DB_POOL_RECYCLE:-1800}"
    image: *bsnap-image
    container_name: bsnap-scheduler
    security_opt:
      - no-new-privileges:true
    cap_add:
      - NET_RAW
    env_file:
      - .env
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./static/snapshots:/app/static/snapshots
      - ./static/videos:/app/static/videos
      - ./logs:/app/logs
      - ./archives/audit_logs:/app/archives/audit_logs
      - shared_tmp:/tmp/shared

    restart: unless-stopped
    command: ["/app/start.sh", "scheduler"]
    healthcheck:
      test: ["CMD", "python", "-m", "app.core.service_health", "scheduler"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
  
  notifier:
    logging: *container-logging
    cpus: "${NOTIFIER_CPUS:-0.5}"
    mem_limit: "${NOTIFIER_MEM_LIMIT:-512m}"
    stop_grace_period: "${NOTIFIER_STOP_GRACE_PERIOD:-60s}"
    init: true
    environment:
      DB_POOL_SIZE: "1"
      DB_MAX_OVERFLOW: "0"
      DB_POOL_TIMEOUT: "${DB_POOL_TIMEOUT:-5}"
      DB_POOL_RECYCLE: "${DB_POOL_RECYCLE:-1800}"
    image: *bsnap-image
    container_name: bsnap-notifier
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    command: ["/app/start.sh", "notifier"]
    healthcheck:
      test: ["CMD", "python", "-m", "app.core.service_health", "notifier"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  postgres:
    logging: *container-logging
    cpus: "${POSTGRES_CPUS:-2.0}"
    mem_limit: "${POSTGRES_MEM_LIMIT:-2g}"
    stop_grace_period: "${POSTGRES_STOP_GRACE_PERIOD:-60s}"
    image: postgres:17.5
    container_name: bsnap-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bsnap_db}
      POSTGRES_USER: ${POSTGRES_USER:-bsnap_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  pgadmin:
    logging: *container-logging
    cpus: "${PGADMIN_CPUS:-1.0}"
    mem_limit: "${PGADMIN_MEM_LIMIT:-512m}"
    stop_grace_period: "${PGADMIN_STOP_GRACE_PERIOD:-60s}"
    profiles: ["admin"]
    image: dpage/pgadmin4
    container_name: bsnap-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-}
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  pgadmin_data:
  shared_tmp:
