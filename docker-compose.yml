services:
  b-snap:
    image: wijayaindra21/b-snap:v1.0.0-multi
    container_name: bsnap-app
    ports:
      - "8080:8080"
    privileged: true
    cap_add:
      - NET_RAW
    env_file:
      - .env
    depends_on:
      - postgres
    volumes:
      - ./static/snapshots:/app/static/snapshots
      - ./app/data.db:/app/app/data.db
    restart: unless-stopped

  postgres:
    image: postgres:17.5
    container_name: bsnap-postgres
    environment:
      POSTGRES_DB: bsnap_db
      POSTGRES_USER: bsnap_user
      POSTGRES_PASSWORD: bsnap_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: bsnap-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: wijaya.indra2196@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: unless-stopped

  pgloader:
    image: dimitri/pgloader:latest
    profiles: ["migrate"]  # <--- hanya jalan kalau kamu minta
    volumes:
      - ./app:/app:ro
    entrypoint: >
      pgloader
      sqlite:///app/sqlite.db
      postgresql://bsnap_user:bsnap_pass@postgres:5432/bsnap_db
    depends_on:
      - postgres
    restart: "no"

volumes:
  postgres_data:
