services:
  b-snap:
    image: wijayaindra21/b-snap:v1.3.1
    container_name: bsnap-app
    ports:
      - "8080:8080"
    privileged: true
    cap_add:
      - NET_RAW
    env_file:
      - .env
    depends_on:
      - postgres
    volumes:
      - ./static/snapshots:/app/static/snapshots
      - ./static/videos:/app/static/videos
      # - ./app/data.db:/app/app/data.db
      - ./logs:/app/logs
      - shared_tmp:/tmp/shared
    restart: unless-stopped
    command: gunicorn app.main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8080 --workers 2 --worker-connections 1000 --timeout 60 --keep-alive 2

  scheduler:
    image: wijayaindra21/b-snap:v1.3.1
    container_name: bsnap-scheduler
    env_file:
      - .env
    depends_on:
      - postgres
    volumes:
      - ./static/snapshots:/app/static/snapshots
      # - ./app/data.db:/app/app/data.db
      - ./logs:/app/logs
      - shared_tmp:/tmp/shared

    restart: unless-stopped
    command: python -m app.jobs.scheduler_main
  
  notifier:
    image: wijayaindra21/b-snap:v1.3.1
    container_name: bsnap-notifier
    env_file:
      - .env
    depends_on:
      - postgres
    restart: unless-stopped
    command: python -m app.ws.notifier

  postgres:
    image: postgres:17.5
    container_name: bsnap-postgres
    environment:
      POSTGRES_DB: bsnap_db
      POSTGRES_USER: bsnap_user
      POSTGRES_PASSWORD: bsnap_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: bsnap-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: wijaya.indra2196@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
  shared_tmp:
