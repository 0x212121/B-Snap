# =============================================================================
# Pre-commit Configuration for B-Snap
# =============================================================================
# Install: pip install pre-commit
# Setup: pre-commit install
# Run all: pre-commit run --all-files
# Run specific: pre-commit run black --all-files
# Update hooks: pre-commit autoupdate
# =============================================================================

repos:
  # ===========================================================================
  # General File Checks
  # ===========================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  # ===========================================================================
  # Python - Import Sorting (Ruff)
  # ===========================================================================
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        name: ruff-import-sort
        args: ["--select", "I", "--fix"]
        files: \.py$

  # ===========================================================================
  # Python - Code Formatting (Black)
  # ===========================================================================
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        name: black-format
        language_version: python3.11
        args: ["--line-length", "100"]
        files: \.py$

  # ===========================================================================
  # Python - Linting (Ruff)
  # ===========================================================================
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        name: ruff-lint
        args: [--fix, --exit-non-zero-on-fix]
        files: \.py$

  # ===========================================================================
  # Python - Type Checking (MyPy)
  # ===========================================================================
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.0
    hooks:
      - id: mypy
        name: mypy-type-check
        additional_dependencies:
          - types-requests
          - types-PyYAML
          - types-python-dateutil
          - pydantic
          - sqlalchemy
          - fastapi
          - httpx
        args: [--ignore-missing-imports, --show-error-codes]
        exclude: ^(alembic/|app/tests/)

  # ===========================================================================
  # Python - Security Check (Bandit)
  # ===========================================================================
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.0
    hooks:
      - id: bandit
        name: bandit-security
        args: ["-c", "pyproject.toml"]
        additional_dependencies: ["bandit[toml]"]
        exclude: ^(app/tests/|alembic/)

  # ===========================================================================
  # Python - Docstring Coverage
  # ===========================================================================
  - repo: https://github.com/econchick/interrogate
    rev: 1.7.0
    hooks:
      - id: interrogate
        name: docstring-coverage
        args: [--fail-under=50, --verbose]
        exclude: ^(app/tests/|alembic/|docs/)

  # ===========================================================================
  # Python - Requirements Check
  # ===========================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: requirements-txt-fixer
        files: requirements.*\.txt$

  # ===========================================================================
  # Docker - Linting
  # ===========================================================================
  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint
        name: dockerfile-lint
        args: ["--ignore", "DL3008", "--ignore", "DL3013"]

  # ===========================================================================
  # Git - Commit Message
  # ===========================================================================
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.0.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

  # ===========================================================================
  # Local Hooks (Custom)
  # ===========================================================================
  - repo: local
    hooks:
      - id: pytest-check
        name: pytest-check
        entry: python -m pytest app/tests -v --tb=short -q
        language: system
        pass_filenames: false
        always_run: false
        stages: [push]
        
      - id: check-version-sync
        name: check-version-sync
        entry: python -c "import re; v1 = re.search(r'version = \"(.+?)\"', open('pyproject.toml').read()).group(1); v2 = re.search(r'__version__ = \"(.+?)\"', open('app/version.py').read()).group(1); assert v1 == v2, f'Version mismatch: pyproject.toml={v1}, app/version.py={v2}'"
        language: system
        pass_filenames: false
        always_run: true
