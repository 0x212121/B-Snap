version: "3.8"

services:
  fastapi:
    build: .
    container_name: bsnap-app
    ports:
      - "8888:8888"
    env_file:
      - .env
    depends_on:
      - postgres
    volumes:
      - .:/app
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: bsnap-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bsnap_db}
      POSTGRES_USER: ${POSTGRES_USER:-bsnap_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  pgadmin:
    profiles: ["admin"]
    image: dpage/pgadmin4
    container_name: bsnap-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-}
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    depends_on:
      - postgres
    restart: unless-stopped

  pgloader:
    image: dimitri/pgloader:latest
    profiles: ["migrate"]  # <--- hanya jalan kalau kamu minta
    volumes:
      - ./app:/app:ro
    environment:
      PGLOADER_TARGET_URL: ${PGLOADER_TARGET_URL:-}
    entrypoint:
      - /bin/sh
      - -ec
      - 'exec pgloader sqlite:///app/sqlite.db "$${PGLOADER_TARGET_URL:?Set PGLOADER_TARGET_URL for the legacy import}"'
    depends_on:
      - postgres
    restart: "no"

volumes:
  postgres_data:
