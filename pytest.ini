[pytest]
# Single source of pytest configuration; environment isolation is in conftest.py.

minversion = 8.0
testpaths = app/tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Default options
addopts =
    -v
    --strict-markers
    --tb=short
    -ra
    -q

markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (may use database/API)
    e2e: End-to-end tests
    slow: Slow tests (skip dengan -m 'not slow')
    camera: Tests requiring actual camera
    database: Tests requiring database connection
    postgres: Tests using an explicit disposable PostgreSQL schema

# Async support
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
