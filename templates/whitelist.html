{% extends "base.html" %}
{% block title %}WhatsApp Whitelist{% endblock %}
{% block content %}
<div class="container mx-auto p-4 sm:p-6 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 min-h-screen">
  <h2 class="text-2xl sm:text-3xl font-bold mb-6 text-center">📱 WhatsApp Whitelist</h2>

  <form id="whitelist-form" class="flex flex-col md:flex-row gap-4 mb-8 p-4 rounded-lg shadow-md bg-gray-50 dark:bg-gray-700">
    <input name="phone_number" placeholder="Phone (628xxxx)" class="border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 p-3 rounded-md w-full md:w-1/4 focus:outline-none focus:ring-2 focus:ring-blue-500" required>
    <input name="name" placeholder="Name" class="border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 p-3 rounded-md w-full md:w-1/4 focus:outline-none focus:ring-2 focus:ring-blue-500">
    <select name="role" class="border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 p-3 rounded-md w-full md:w-1/4 focus:outline-none focus:ring-2 focus:ring-blue-500">
      <option value="user">User</option>
      <option value="admin">Admin</option>
    </select>
    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-3 rounded-md w-full md:w-auto transition duration-300 ease-in-out">➕ Add</button>
  </form>

  <div class="overflow-x-auto rounded-lg shadow-md">
    <table class="w-full text-left bg-white dark:bg-gray-700">
      <thead class="bg-gray-200 dark:bg-gray-600">
        <tr>
          <th class="py-3 px-4 text-sm font-semibold uppercase tracking-wider text-gray-700 dark:text-gray-200">Phone</th>
          <th class="py-3 px-4 text-sm font-semibold uppercase tracking-wider text-gray-700 dark:text-gray-200">Name</th>
          <th class="py-3 px-4 text-sm font-semibold uppercase tracking-wider text-gray-700 dark:text-gray-200">Role</th>
          <th class="py-3 px-4 text-sm font-semibold uppercase tracking-wider text-gray-700 dark:text-gray-200">Active</th>
          <th class="py-3 px-4 text-sm font-semibold uppercase tracking-wider text-gray-700 dark:text-gray-200">Actions</th>
        </tr>
      </thead>
      <tbody id="whitelist-table" class="divide-y divide-gray-200 dark:divide-gray-600"></tbody>
    </table>
  </div>
</div>

<script>
  async function loadWhitelist() {
    const res = await fetch('/api/whitelist');
    const data = await res.json();
    const tbody = document.getElementById("whitelist-table");
    tbody.innerHTML = "";
    console.log("WHITELIST DATA:", data);
    data.forEach(w => {
      tbody.innerHTML += `
        <tr class="hover:bg-gray-50 dark:hover:bg-gray-600">
          <td class="py-3 px-4 whitespace-nowrap">${w.phone_number}</td>
          <td class="py-3 px-4 whitespace-nowrap">${w.name || "-"}</td>
          <td class="py-3 px-4 whitespace-nowrap">${w.role}</td>
          <td class="py-3 px-4 whitespace-nowrap">
            <input type="checkbox" ${w.is_active ? 'checked' : ''} onchange="toggleActive('${w.phone_number}', this.checked)" class="form-checkbox h-5 w-5 text-blue-600 dark:text-blue-400 rounded focus:ring-blue-500">
          </td>
          <td class="py-3 px-4 whitespace-nowrap">
            <button onclick="deleteEntry('${w.phone_number}')" class="text-red-600 hover:text-red-800 dark:text-red-400 dark:hover:text-red-300 transition duration-300 ease-in-out">🗑 Delete</button>
          </td>
        </tr>`;
    });
  }

  async function toggleActive(phone, state) {
    await fetch('/api/whitelist', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ phone_number: phone, is_active: state })
    });
    loadWhitelist();
  }

  async function deleteEntry(phone) {
    await fetch(`/api/whitelist/${phone}`, { method: 'DELETE' });
    loadWhitelist();
  }

  document.getElementById("whitelist-form").onsubmit = async (e) => {
    e.preventDefault();
    const formData = new FormData(e.target);
    const obj = Object.fromEntries(formData.entries());
    obj.is_active = true;
    await fetch('/api/whitelist', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(obj)
    });
    e.target.reset();
    loadWhitelist();
  };

  loadWhitelist();
</script>
{% endblock %}
