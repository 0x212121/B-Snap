{% extends "base.html" %}
{% block title %}B-SNAP – WhatsApp Whitelist{% endblock %}

{% block content %}
<div class="container mx-auto p-4 text-gray-900 dark:text-gray-100 rounded-lg shadow">
  <!-- Header -->
  <div class="flex items-center justify-between mb-6">
    <h2 class="text-2xl sm:text-3xl font-bold flex items-center gap-2">
      <img src="/static/icons/WhatsApp.svg" alt="WhatsApp Icon" class="w-7 h-7">
      WhatsApp Whitelist
    </h2>
  </div>

  <!-- Form -->
  <form id="whitelist-form" class="grid grid-cols-1 md:grid-cols-5 gap-4 mb-8 p-5 rounded-xl shadow-md bg-gray-50 dark:bg-gray-700">
    <div>
      <label for="phone_number" class="block text-sm font-medium mb-1">Phone</label>
      <input id="phone_number" name="phone_number" placeholder="628xxxx" 
        class="border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 p-3 rounded-lg w-full focus:outline-none focus:ring-2 focus:ring-blue-500" required>
    </div>

    <div>
      <label for="name" class="block text-sm font-medium mb-1">Name</label>
      <input id="name" name="name" placeholder="Full Name" 
        class="border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 p-3 rounded-lg w-full focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>

    <div>
      <label for="role" class="block text-sm font-medium mb-1">Role</label>
      <select id="role" name="role" 
        class="border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 p-3 rounded-lg w-full focus:outline-none focus:ring-2 focus:ring-blue-500">
        <option value="user">User</option>
        <option value="admin">Admin</option>
      </select>
    </div>

    <div>
      <label for="group_id" class="block text-sm font-medium mb-1">Group</label>
      <select id="group_id" name="group_id" 
        class="border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 p-3 rounded-lg w-full focus:outline-none focus:ring-2 focus:ring-blue-500" required>
        <option value="">-- Select Group --</option>
      </select>
    </div>

    <div class="flex items-end">
      <button type="submit" 
        class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-4 rounded-md text-sm font-semibold flex items-center gap-2 shadow-sm">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" /></svg> Add</button>
      </div>
  </form>

  <!-- Table -->
  <div class="overflow-x-auto rounded-xl shadow-md">
    <table class="w-full text-left bg-white dark:bg-gray-700">
      <thead class="bg-gray-200 dark:bg-gray-600">
        <tr>
          <th class="py-3 px-4 text-sm font-semibold tracking-wider text-gray-700 dark:text-gray-200">Phone</th>
          <th class="py-3 px-4 text-sm font-semibold tracking-wider text-gray-700 dark:text-gray-200">Name</th>
          <th class="py-3 px-4 text-sm font-semibold tracking-wider text-gray-700 dark:text-gray-200">Role</th>
          <th class="py-3 px-4 text-sm font-semibold tracking-wider text-gray-700 dark:text-gray-200">Group</th>
          <th class="py-3 px-4 text-sm font-semibold tracking-wider text-gray-700 dark:text-gray-200">Active</th>
          <th class="py-3 px-4 text-sm font-semibold tracking-wider text-gray-700 dark:text-gray-200 text-center">Actions</th>
        </tr>
      </thead>
      <tbody id="whitelist-table" class="divide-y divide-gray-200 dark:divide-gray-600">
        <!-- Row Example -->
        <!-- 
        <tr>
          <td class="py-3 px-4">628123456789</td>
          <td class="py-3 px-4">John Doe</td>
          <td class="py-3 px-4">Admin</td>
          <td class="py-3 px-4">Tower A</td>
          <td class="py-3 px-4">
            <label class="inline-flex items-center cursor-pointer">
              <input type="checkbox" class="sr-only peer">
              <div class="w-11 h-6 bg-gray-300 peer-focus:outline-none rounded-full peer peer-checked:bg-green-500 relative after:content-[''] after:absolute after:top-0.5 after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:after:translate-x-full"></div>
            </label>
          </td>
          <td class="py-3 px-4 text-center space-x-2">
            <button class="text-blue-600 hover:text-blue-800" title="Edit">✏️</button>
            <button class="text-red-600 hover:text-red-800" title="Delete">🗑</button>
          </td>
        </tr>
        -->
      </tbody>
    </table>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  const GROUP_API = '/api/camera_groups';

  // --- Notification Function ---
  function showNotification(message, type = 'success') {
    const container = document.getElementById('notification-container');
    if (!container) return;
    const notification = document.createElement('div');
    const baseClasses = 'p-4 mb-3 rounded-lg shadow-lg flex items-center gap-x-4 text-white transition-all duration-300 ease-in-out transform';
    const typeStyles = { success: 'bg-green-500', error: 'bg-red-500', info: 'bg-blue-500' };
    notification.className = `${baseClasses} ${typeStyles[type] || 'bg-gray-500'}`;
    notification.style.opacity = '0';
    notification.style.transform = 'translateX(100%)';
    notification.innerHTML = `<span class="flex-grow">${message}</span><button class="font-semibold text-lg leading-none">&times;</button>`;
    container.appendChild(notification);
    setTimeout(() => {
      notification.style.opacity = '1';
      notification.style.transform = 'translateX(0)';
    }, 10);
    const removeNotification = () => {
      notification.style.opacity = '0';
      notification.style.transform = 'translateX(100%)';
      setTimeout(() => { notification.remove(); }, 300);
    };
    const autoDismissTimer = setTimeout(removeNotification, 5000);
    notification.querySelector('button').addEventListener('click', () => {
      clearTimeout(autoDismissTimer);
      removeNotification();
    });
  }
  
  // --- Page-Specific Logic ---
  
  function validatePhoneNumber(phone) {
    const regex = /^628[1-9][0-9]{7,12}$/;
    return regex.test(phone);
  }

  async function loadGroups() {
  try {
    const res = await fetch(GROUP_API);
    const groups = await res.json();
    const groupSelect = document.getElementById('group_id');
    groupSelect.innerHTML = `<option value="">-- Select Group --</option>`;
    groups.forEach(g => {
      const opt = document.createElement('option');
      opt.value = g.id;
      opt.textContent = g.name;
      groupSelect.appendChild(opt);
    });
  } catch (err) {
    console.error('Failed to load groups', err);
  }
}
  
  async function loadWhitelist() {
  const res = await fetch('/api/whitelist');
  const data = await res.json();
  const tbody = document.getElementById("whitelist-table");
  tbody.innerHTML = "";

  data.forEach(w => {
    tbody.innerHTML += `
      <tr class="hover:bg-gray-50 dark:hover:bg-gray-600 transition-colors">
        <td class="py-3 px-4 whitespace-nowrap">${w.phone_number}</td>
        <td class="py-3 px-4 whitespace-nowrap">${w.name || "-"}</td>
        <td class="py-3 px-4 whitespace-nowrap">${w.role}</td>
        <td class="p-3">${w.group_name || "-"}</td>
        <td class="py-3 px-4 whitespace-nowrap">
          <input type="checkbox" ${w.is_active ? 'checked' : ''} onchange="toggleActive('${w.phone_number}', '${w.name}', '${w.role}', this.checked)" class="form-checkbox h-5 w-5 text-blue-600 dark:text-blue-400 rounded focus:ring-blue-500">
        </td>
        <td class="py-3 px-4 whitespace-nowrap text-center space-x-2">
          <button
            onclick="showEditModal('${w.phone_number}', '${w.name}', '${w.role}', '${w.group_id}', ${w.is_active})"
            title="Edit whitelist"
            class="inline-flex items-center justify-center p-1.5 rounded transition-colors duration-150 hover:bg-yellow-200 dark:hover:bg-yellow-800/50">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5 text-yellow-500">
              <path d="M21.731 2.269a2.625 2.625 0 0 0-3.712 0l-1.157 1.157 3.712 3.712 1.157-1.157a2.625 2.625 0 0 0 0-3.712ZM19.513 8.199l-3.712-3.712-12.15 12.15a5.25 5.25 0 0 0-1.32 2.214l-.8 2.685a.75.75 0 0 0 .933.933l2.685-.8a5.25 5.25 0 0 0 2.214-1.32L19.513 8.2Z" />
            </svg>
          </button>

          <button
            onclick="confirmDelete('${w.phone_number}')"
            title="Delete whitelist"
            class="inline-flex items-center justify-center p-1.5 rounded transition-colors duration-150 hover:bg-red-200 dark:hover:bg-red-800/50">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5 text-red-600"><path fill-rule="evenodd" d="M16.5 4.478v.227a48.816 48.816 0 0 1 3.878.512.75.75 0 1 1-.256 1.478l-.209-.035-1.005 13.07a3 3 0 0 1-2.991 2.77H8.084a3 3 0 0 1-2.991-2.77L4.087 6.66l-.209.035a.75.75 0 0 1-.256-1.478A48.567 48.567 0 0 1 7.5 4.705v-.227c0-1.564 1.213-2.9 2.816-2.951a52.662 52.662 0 0 1 3.369 0c1.603.051 2.815 1.387 2.815 2.951Zm-6.136-1.452a51.196 51.196 0 0 1 3.273 0C14.39 3.05 15 3.684 15 4.478v.113a49.488 49.488 0 0 0-6 0v-.113c0-.794.609-1.428 1.364-1.452Zm-.355 5.945a.75.75 0 1 0-1.5.058l.347 9a.75.75 0 1 0 1.499-.058l-.346-9Zm5.48.058a.75.75 0 1 0-1.498-.058l-.347 9a.75.75 0 0 0 1.5.058l.345-9Z" clip-rule="evenodd" /></svg>
          </button>
        </td>
      </tr>`;
  });
}
  
async function toggleActive(phone, name, role, state) {
  await fetch('/api/whitelist', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ phone_number: phone, name, role, is_active: state })
  });
  loadWhitelist();
  showNotification("Status updated", 'success');
}
  
  // PERUBAHAN: Fungsi confirmDelete sekarang menggunakan modal global
  function confirmDelete(phone) {
    const message = `Are you sure you want to delete ${phone} from the whitelist?`;
    
    // Panggil fungsi global dari base.html
    showGlobalConfirm(message, async () => {
      // Logika yang dijalankan saat tombol "Yes" diklik
      await fetch(`/api/whitelist/${phone}`, { method: 'DELETE' });
      showNotification(`Deleted ${phone}`, 'error');
      loadWhitelist();
    }, {
      // Opsi untuk kustomisasi modal
      title: '⚠️ Delete Whitelist Number',
      confirmText: 'Yes, Delete',
      confirmClasses: 'bg-red-600 hover:bg-red-700'
    });
  }
  
  // Fungsi closeModal dan event listener confirmYes telah dihapus karena tidak diperlukan lagi
  
  document.getElementById("whitelist-form").onsubmit = async (e) => {
    e.preventDefault();
    const formData = new FormData(e.target);
    const obj = Object.fromEntries(formData.entries());
    obj.is_active = true;
    
    if (!validatePhoneNumber(obj.phone_number)) {
      showNotification("❌ Invalid phone number. Format: 628xxxxxxxxxx", 'error');
      return;
    }
    
    const res = await fetch('/api/whitelist', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(obj)
    });
    
    if (res.ok) {
      e.target.reset();
      showNotification("✅ Number added to whitelist", 'success');
      loadWhitelist();
    } else {
      const err = await res.json();
      showNotification(`❌ Failed: ${err.detail || 'Unknown error'}`, 'error');
    }
  };

  // Modal edit
// Modal edit
  async function showEditModal(phone, name, role, groupId, isActive) {
    const res = await fetch(GROUP_API);
    const groups = await res.json();

    const modalHtml = `
      <div id="edit-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50">
        <div class="bg-white dark:bg-gray-800 p-6 rounded-lg shadow-lg w-full max-w-md text-gray-900 dark:text-gray-100">
          <h3 class="text-xl font-bold mb-4">Edit Whitelist Entry</h3>
          <form id="edit-form">
            <div class="mb-4">
              <label class="block mb-1 text-gray-700 dark:text-gray-200">Phone</label>
              <input type="text" name="phone" value="${phone}" class="w-full p-2 border border-gray-300 dark:border-gray-600 rounded bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100" readonly>
            </div>
            <div class="mb-4">
              <label class="block mb-1 text-gray-700 dark:text-gray-200">Name</label>
              <input type="text" name="name" value="${name}" class="w-full p-2 border border-gray-300 dark:border-gray-600 rounded bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100">
            </div>
            <div class="mb-4">
              <label class="block mb-1 text-gray-700 dark:text-gray-200">Role</label>
              <select name="role" class="w-full p-2 border border-gray-300 dark:border-gray-600 rounded bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100">
                <option value="user" ${role === 'user' ? 'selected' : ''}>User</option>
                <option value="admin" ${role === 'admin' ? 'selected' : ''}>Admin</option>
              </select>
            </div>
             <div>
              <label class="block text-sm">Group</label>
              <select id="edit-group" name="group_id" class="w-full border rounded px-2 py-1 dark:bg-gray-700">
                <option value="">-- None --</option>
                ${groups.map(g => `<option value="${g.id}">${g.name}</option>`).join('')}
              </select>
            </div>
            <div class="mb-4">
              <label class="block mb-1 text-gray-700 dark:text-gray-200">Active</label>
              <input type="checkbox" name="is_active" ${isActive ? 'checked' : ''} class="form-checkbox h-5 w-5 text-blue-600 dark:text-blue-400 rounded focus:ring-blue-500">
            </div>
            <div class="flex justify-end gap-2">
              <button type="button" id="cancel-edit" class="bg-gray-400 dark:bg-gray-600 hover:bg-gray-500 dark:hover:bg-gray-700 text-white px-4 py-2 rounded">Cancel</button>
              <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded">Save</button>
            </div>
          </form>
        </div>
      </div>
    `;
    
    document.body.insertAdjacentHTML('beforeend', modalHtml);

    // Set the selected group after the modal is in the DOM
    const editGroupSelect = document.getElementById('edit-group');
    if (groupId) {
      editGroupSelect.value = groupId;
    }

    document.getElementById('cancel-edit').onclick = () => {
      document.getElementById('edit-modal').remove();
    };

    document.getElementById('edit-form').onsubmit = async (e) => {
      e.preventDefault();
      const form = e.target;
      const updatedData = {
          name: form.name.value,
          role: form.role.value,
          group_id: form.group_id.value || null,
          is_active: form.is_active.checked,
      };
      
      const res = await fetch('/api/whitelist/' + phone, {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(updatedData)
      });
      
      if (res.ok) {
        showNotification('✅ Updated ' + phone, 'success');
        loadWhitelist();
      } else {
        const err = await res.json();
        showNotification(`❌ Failed: ${err.detail || 'Unknown error'}`, 'error');
      }
      document.getElementById('edit-modal').remove();
    };
  }

  loadGroups();
  loadWhitelist();
</script>
{% endblock %}
