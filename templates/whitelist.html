{% extends "base.html" %}
{% block title %}B-SNAP – WhatsApp Whitelist{% endblock %}
{% from "_icons.html" import icon_search, icon_pencil, icon_trash %}

{% block content %}
<div class="container mx-auto px-4 py-6">

  <!-- Action bar -->
  <div class="flex flex-wrap items-center gap-4 mb-6">
    <h2 class="text-2xl font-bold text-gray-800 dark:text-gray-200 flex items-center gap-2">
      <img src="/static/icons/WhatsApp.svg" alt="WhatsApp Icon" class="w-7 h-7">
      WhatsApp Whitelist
    </h2>

    <!-- Spacer -->
    <div class="flex-1"></div>

    <!-- Per page -->
    <div class="flex items-center gap-2">
      <label for="perPageSelect" class="text-sm font-medium text-gray-700 dark:text-gray-300">Items per page:</label>
      <select id="perPageSelect" class="rounded-md pr-8 border-gray-300 shadow-sm dark:bg-gray-700 dark:border-gray-600 dark:text-white focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50 text-sm py-2 px-3">
        <option value="10">10</option>
        <option value="20" selected>20</option>
        <option value="50">50</option>
        <option value="100">100</option>
      </select>
    </div>
  </div>

  <!-- Card -->
  <div class="bg-white dark:bg-gray-800 shadow-lg rounded-lg p-6">

    <!-- Search + Add -->
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
      <form id="searchForm" class="flex gap-2 w-full md:w-auto">
        <input id="searchInput" type="text" placeholder="Search phone or name..." class="w-full md:w-72 px-4 py-2 rounded-md border border-gray-300 dark:bg-gray-700 dark:border-gray-600 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
        <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 text-sm font-semibold flex items-center gap-2 shadow-sm">
          <span>{{ icon_search("w-5 h-5 text-gray-100 inline") }}</span> Search
        </button>
      </form>

      <!-- Add form inline -->
      <form id="whitelist-form" class="grid grid-cols-1 md:grid-cols-5 gap-3 w-full md:w-auto">
        <input id="phone_number" name="phone_number" placeholder="628xxxxxxxxxx"
               class="px-3 py-2 rounded-md border border-gray-300 dark:bg-gray-700 dark:border-gray-600 dark:text-white focus:ring-2 focus:ring-blue-500" required>
        <input id="name" name="name" placeholder="Full name"
               class="px-3 py-2 rounded-md border border-gray-300 dark:bg-gray-700 dark:border-gray-600 dark:text-white focus:ring-2 focus:ring-blue-500">
        <select id="role" name="role"
                class="px-3 py-2 rounded-md border border-gray-300 dark:bg-gray-700 dark:border-gray-600 dark:text-white focus:ring-2 focus:ring-blue-500">
          <option value="user">User</option>
          <option value="admin">Admin</option>
        </select>
        <select id="group_id" name="group_id" required
                class="px-3 py-2 rounded-md border border-gray-300 dark:bg-gray-700 dark:border-gray-600 dark:text-white focus:ring-2 focus:ring-blue-500">
          <option value="">-- Select Group --</option>
        </select>
        <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-md text-sm font-semibold flex items-center justify-center gap-2 shadow-sm">Add</button>
      </form>
    </div>

    <!-- Table -->
    <div class="overflow-x-auto">
      <table class="min-w-full">
        <thead class="bg-gray-50 dark:bg-gray-700">
          <tr>
            <th class="p-3 text-left text-sm font-semibold text-gray-600 dark:text-gray-300">Phone</th>
            <th class="p-3 text-left text-sm font-semibold text-gray-600 dark:text-gray-300">Name</th>
            <th class="p-3 text-left text-sm font-semibold text-gray-600 dark:text-gray-300">Role</th>
            <th class="p-3 text-left text-sm font-semibold text-gray-600 dark:text-gray-300">Group</th>
            <th class="p-3 text-left text-sm font-semibold text-gray-600 dark:text-gray-300">Active</th>
            <th class="p-3 text-center text-sm font-semibold text-gray-600 dark:text-gray-300">Actions</th>
          </tr>
        </thead>
        <tbody id="whitelist-table" class="bg-white dark:bg-gray-800 divide-y divide-gray-200 dark:divide-gray-700"></tbody>
      </table>
    </div>

    <!-- Pagination -->
    <div id="pagination-controls" class="flex justify-center items-center gap-2 mt-6 text-sm"></div>
  </div>
</div>

<!-- Shared notification container (same as cameras.html) -->
<div id="notification-container" class="fixed top-5 right-5 z-[100] w-full max-w-sm"></div>

{% endblock %}

{% block scripts %}
<script>
  const GROUP_API = '/api/camera_groups';

  // ====== STATE ======
  let cameraGroups = [];
  let currentPage = 1;
  let perPage = 20;
  let totalPages = 1;
  let currentSearch = "";

  // ====== UTIL ======
  function showNotification({ status = 'success', message }) {
    const container = document.getElementById('notification-container');
    const notif = document.createElement('div');
    const statusClass = status === 'success' ? 'bg-green-500' : (status === 'info' ? 'bg-blue-500' : 'bg-red-500');
    const icon = status === 'success' ? '✅' : (status === 'info' ? 'ℹ️' : '❌');
    notif.className = `flex items-center p-4 mb-4 rounded-lg shadow-lg text-white transform transition-all duration-300 ease-in-out opacity-0 translate-y-[-20px] ${statusClass}`;
    notif.innerHTML = `<span class="mr-3 text-lg">${icon}</span> <span class="font-medium">${message}</span>`;
    container.appendChild(notif);
    requestAnimationFrame(() => notif.classList.remove('opacity-0', 'translate-y-[-20px]'));
    setTimeout(() => {
      notif.classList.add('opacity-0');
      notif.addEventListener('transitionend', () => notif.remove());
    }, 3500);
  }

  function validatePhoneNumber(phone) {
    // 628xxxxxxxx minimal ~10-15 digit total
    return /^628[1-9][0-9]{7,12}$/.test(phone);
  }

  async function safeParseJSONResponse(res) {
    // Baca sekali saja; kenali content-type
    const ct = res.headers.get('content-type') || '';
    if (ct.includes('application/json')) {
      return await res.json();
    }
    // fallback text (HTML/teks error)
    const text = await res.text();
    // coba parse jika memang JSON “tanpa” content-type yang benar
    try { return JSON.parse(text); } catch { return { detail: text }; }
  }

  // ====== GROUPS ======
  async function loadGroups() {
    try {
      const res = await fetch(GROUP_API);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const groups = await res.json();
      cameraGroups = Array.isArray(groups) ? groups : [];

      const sel = document.getElementById('group_id');
      sel.innerHTML = `<option value="">-- Select Group --</option>`;
      cameraGroups.forEach(g => {
        const opt = document.createElement('option');
        opt.value = g.id;
        opt.textContent = g.name;
        sel.appendChild(opt);
      });
    } catch (err) {
      console.error('Failed to load camera groups:', err);
    }
  }

  // ====== TABLE & PAGINATION ======
  function buildPagination(container, page, total) {
    container.innerHTML = '';
    if (total <= 1) return;

    const makeLink = (label, targetPage, disabled = false, active = false) => {
      const el = document.createElement(active ? 'span' : 'a');
      el.textContent = label;
      el.className = active
        ? 'px-3 py-1 bg-blue-600 text-white rounded font-bold'
        : 'px-3 py-1 bg-gray-200 dark:bg-gray-700 rounded hover:bg-blue-500 dark:hover:bg-blue-600 hover:text-white';
      if (!active && !disabled) {
        el.href = '#';
        el.onclick = (e) => { e.preventDefault(); loadWhitelist(targetPage); };
      }
      return el;
    };

    const windowSize = 2;

    if (page > 1) {
      container.appendChild(makeLink('First', 1));
      container.appendChild(makeLink('«', page - 1));
    }

    if (page > windowSize + 2) {
      container.appendChild(document.createTextNode('...'));
    }

    for (let i = Math.max(1, page - windowSize); i <= Math.min(total, page + windowSize); i++) {
      container.appendChild(makeLink(String(i), i, false, i === page));
    }

    if (page < total - windowSize - 1) {
      container.appendChild(document.createTextNode('...'));
    }

    if (page < total) {
      container.appendChild(makeLink('»', page + 1));
      container.appendChild(makeLink('Last', total));
    }
  }

  async function loadWhitelist(page = 1) {
    const params = new URLSearchParams({
      page: page,
      limit: perPage
    });
    if (currentSearch) params.append('search', currentSearch);

    const tbody = document.getElementById('whitelist-table');
    const pag = document.getElementById('pagination-controls');

    try {
      tbody.style.opacity = '0.5';
      const res = await fetch(`/api/whitelist?${params.toString()}`);
      if (!res.ok) {
        const body = await res.text();
        throw new Error(`HTTP ${res.status} – ${body.slice(0, 120)}...`);
      }
      const result = await res.json();

      const data = result.data || [];
      totalPages = result.total_pages || 1;
      currentPage = result.page || page;

      tbody.innerHTML = '';
      if (data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="p-6 text-center text-gray-500 dark:text-gray-400">No results found</td></tr>`;
      } else {
        data.forEach(w => {
          tbody.insertAdjacentHTML('beforeend', `
            <tr class="border-b dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors text-sm text-gray-700 dark:text-gray-300">
              <td class="p-3 font-semibold">${w.phone_number}</td>
              <td class="p-3">${w.name || '-'}</td>
              <td class="p-3">${w.role}</td>
              <td class="p-3">${w.group_name || '-'}</td>
              <td class="p-3">
                <input type="checkbox" ${w.is_active ? 'checked' : ''} onchange="toggleActive('${w.phone_number}', '${w.name || ''}', '${w.role}', this.checked)" class="h-5 w-5 text-blue-600">
              </td>
              <td class="p-3 text-center space-x-1 whitespace-nowrap">
                <button onclick="showEditModal('${w.phone_number}', '${w.name || ''}', '${w.role}', '${w.group_id || ''}', ${w.is_active})"
                        title="Edit whitelist"
                        class="inline-flex items-center justify-center p-1.5 rounded transition-colors duration-150 hover:bg-yellow-200 dark:hover:bg-yellow-800/50">
                  {{ icon_pencil("w-5 h-5 text-yellow-500") }}
                </button>
                <button onclick="confirmDelete('${w.phone_number}')"
                        title="Delete whitelist"
                        class="inline-flex items-center justify-center p-1.5 rounded transition-colors duration-150 hover:bg-red-200 dark:hover:bg-red-800/50">
                  {{ icon_trash("w-5 h-5 text-red-600") }}
                </button>
              </td>
            </tr>
          `);
        });
      }

      // Build pagination like cameras.html
      buildPagination(pag, currentPage, totalPages);

      // Sync URL
      const url = new URL(window.location);
      url.searchParams.set('page', currentPage);
      url.searchParams.set('per_page', perPage);
      if (currentSearch) url.searchParams.set('search', currentSearch); else url.searchParams.delete('search');
      window.history.pushState({ page: currentPage, perPage }, '', url);

    } catch (err) {
      console.error('Failed to load whitelist:', err);
      showNotification({ status: 'error', message: 'Failed to load whitelist data.' });
    } finally {
      tbody.style.opacity = '1';
    }
  }

  // ====== ACTIONS ======
  async function toggleActive(phone, name, role, state) {
    try {
      const res = await fetch(`/api/whitelist/${encodeURIComponent(phone)}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, role, is_active: state })
      });

      if (!res.ok) {
        const body = await res.text(); // baca sekali!
        let msg;
        try { msg = (JSON.parse(body).detail) || body; } catch { msg = body; }
        throw new Error(msg);
      }

      showNotification({ status: 'success', message: 'Status updated' });
      loadWhitelist(currentPage);
    } catch (error) {
      console.error('Error updating whitelist:', error);
      showNotification({ status: 'error', message: `Failed to update: ${error.message || 'Unknown error'}` });
    }
  }

  function confirmDelete(phone) {
    const message = `Are you sure you want to delete ${phone}?`;
    showGlobalConfirm(message, async () => {
      try {
        const res = await fetch(`/api/whitelist/${encodeURIComponent(phone)}`, { method: 'DELETE' });
        if (!res.ok) {
          const body = await res.text();
          let msg;
          try { msg = (JSON.parse(body).detail) || body; } catch { msg = body; }
          throw new Error(msg);
        }
        showNotification({ status: 'success', message: `Deleted ${phone}` });
        loadWhitelist(currentPage);
      } catch (err) {
        showNotification({ status: 'error', message: `Delete failed: ${err.message || 'Unknown error'}` });
      }
    }, {
      title: '⚠️ Delete Whitelist Number',
      confirmText: 'Yes, Delete',
      confirmClasses: 'bg-red-600 hover:bg-red-700'
    });
  }

  async function showEditModal(phone, name, role, groupId, isActive) {
    try {
      // ensure groups loaded
      if (!cameraGroups.length) await loadGroups();

      const modalHtml = `
      <div id="edit-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-60 p-4">
        <div class="bg-white dark:bg-gray-800 p-6 rounded-lg shadow-2xl w-full max-w-md text-gray-900 dark:text-gray-100">
          <div class="flex justify-between items-center mb-4 pb-3 border-b border-gray-200 dark:border-gray-700">
            <h3 class="text-xl font-bold">Edit Whitelist Entry</h3>
            <button id="close-edit" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 transition-colors">✕</button>
          </div>
          <form id="edit-form" class="space-y-4">
            <div>
              <label class="block mb-1 text-sm font-medium">Phone</label>
              <input type="text" name="phone" value="${phone}" class="w-full px-3 py-2 border rounded-md bg-gray-100 dark:bg-gray-700 dark:border-gray-600" readonly>
            </div>
            <div>
              <label class="block mb-1 text-sm font-medium">Name</label>
              <input type="text" name="name" value="${name || ''}" class="w-full px-3 py-2 border rounded-md dark:bg-gray-700 dark:border-gray-600">
            </div>
            <div>
              <label class="block mb-1 text-sm font-medium">Role</label>
              <select name="role" class="w-full px-3 py-2 border rounded-md dark:bg-gray-700 dark:border-gray-600">
                <option value="user" ${role === 'user' ? 'selected' : ''}>User</option>
                <option value="admin" ${role === 'admin' ? 'selected' : ''}>Admin</option>
              </select>
            </div>
            <div>
              <label class="block mb-1 text-sm font-medium">Group</label>
              <select name="group_id" class="w-full px-3 py-2 border rounded-md dark:bg-gray-700 dark:border-gray-600">
                <option value="">-- None --</option>
                ${cameraGroups.map(g => `<option value="${g.id}" ${String(g.id) === String(groupId) ? 'selected' : ''}>${g.name}</option>`).join('')}
              </select>
            </div>
            <label class="flex items-center gap-2 text-sm">
              <input type="checkbox" name="is_active" ${isActive ? 'checked' : ''} class="h-5 w-5 text-blue-600">
              Active
            </label>
            <div class="flex justify-end gap-2 pt-2">
              <button type="button" id="cancel-edit" class="px-4 py-2 bg-gray-200 hover:bg-gray-300 text-gray-800 dark:bg-gray-600 dark:hover:bg-gray-500 dark:text-gray-200 rounded-md font-semibold text-sm">Cancel</button>
              <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-md font-semibold text-sm shadow-sm">Save</button>
            </div>
          </form>
        </div>
      </div>`;
      document.body.insertAdjacentHTML('beforeend', modalHtml);

      const removeModal = () => {
        const m = document.getElementById('edit-modal');
        if (m) m.remove();
      };
      document.getElementById('close-edit').onclick = removeModal;
      document.getElementById('cancel-edit').onclick = removeModal;

      document.getElementById('edit-form').onsubmit = async (e) => {
        e.preventDefault();
        const form = e.target;
        const payload = {
          name: form.name.value || null,
          role: form.role.value || 'user',
          group_id: form.group_id.value || null,
          is_active: form.is_active.checked
        };
        try {
          const res = await fetch(`/api/whitelist/${encodeURIComponent(phone)}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          if (!res.ok) {
            const body = await res.text();
            let msg; try { msg = (JSON.parse(body).detail) || body; } catch { msg = body; }
            throw new Error(msg);
          }
          showNotification({ status: 'success', message: `Updated ${phone}` });
          removeModal();
          loadWhitelist(currentPage);
        } catch (err) {
          showNotification({ status: 'error', message: `Failed: ${err.message || 'Unknown error'}` });
        }
      };
    } catch (err) {
      console.error('Failed to show edit modal:', err);
    }
  }

  // ====== CREATE ======
  document.getElementById('whitelist-form').onsubmit = async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const obj = Object.fromEntries(fd.entries());
    obj.is_active = true;

    if (!validatePhoneNumber(obj.phone_number)) {
      showNotification({ status: 'error', message: 'Invalid phone number format (use 628...)' });
      return;
    }

    try {
      const res = await fetch('/api/whitelist', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(obj)
      });

      if (res.ok) {
        e.target.reset();
        showNotification({ status: 'success', message: 'Number added to whitelist' });
        loadWhitelist(1);
      } else {
        const text = await res.text(); // baca sekali
        let errMsg;
        try { errMsg = (JSON.parse(text).detail) || text; } catch { errMsg = text; }
        const status = res.status;
        showNotification({ status: 'error', message: status === 409 ? errMsg : `Failed: ${errMsg}` });
      }
    } catch (err) {
      showNotification({ status: 'error', message: 'Network error' });
    }
  };

  // ====== EVENTS ======
  document.getElementById('searchForm').addEventListener('submit', (e) => {
    e.preventDefault();
    currentSearch = document.getElementById('searchInput').value.trim();
    loadWhitelist(1);
  });

  document.getElementById('perPageSelect').addEventListener('change', (e) => {
    perPage = parseInt(e.target.value, 10) || 20;
    loadWhitelist(1);
  });

  // Init
  document.addEventListener('DOMContentLoaded', async () => {
    // Read per_page from URL like cameras.html
    const urlParams = new URLSearchParams(window.location.search);
    const p = urlParams.get('per_page');
    const s = urlParams.get('search');
    const pg = urlParams.get('page');

    if (p) {
      perPage = parseInt(p, 10) || 20;
      document.getElementById('perPageSelect').value = perPage;
    }
    if (s) {
      currentSearch = s;
      document.getElementById('searchInput').value = s;
    }

    await loadGroups();
    await loadWhitelist(pg ? parseInt(pg, 10) : 1);
  });

  // Expose some functions globally
  window.toggleActive = toggleActive;
  window.confirmDelete = confirmDelete;
  window.showEditModal = showEditModal;
</script>
{% endblock %}
