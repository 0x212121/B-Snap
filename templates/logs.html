{% extends "base.html" %}
{% block content %}
<div class="p-6 space-y-6">
  <div class="flex justify-between items-center">
    <h1 class="text-2xl font-bold">Logs Viewer</h1>
    <div class="flex gap-2 items-center">
      <label for="log_type" class="text-sm font-medium">Select Log:</label>
      <select id="log_type" class="border rounded px-2 py-1 dark:bg-gray-700">
        <option value="main" selected>Main</option>
        <option value="snapshot">Snapshot</option>
        <option value="healthcheck">Health Check</option>
        <option value="scheduler">Scheduler</option>
        <option value="management">Management</option>
      </select>

      <a id="downloadBtn"
         href="/logs/download/main"
         class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded shadow">
         Download Log
      </a>

      <button id="refreshBtn"
              type="button"
              class="bg-gray-500 text-white px-3 py-1 rounded hover:bg-gray-600">
              Refresh
      </button>
    </div>
  </div>

  <div id="logViewer"
       class="bg-black text-green-400 font-mono text-sm rounded p-4 overflow-auto max-h-[70vh]">
    <div>Loading logs...</div>
  </div>
</div>

<script>
  const logTypeSelect = document.getElementById('log_type');
  const downloadBtn = document.getElementById('downloadBtn');
  const refreshBtn = document.getElementById('refreshBtn');
  const logViewer = document.getElementById('logViewer');

  async function fetchLog(logType) {
    const res = await fetch(`/logs/content/${logType}`);
    const data = await res.json();
    logViewer.innerHTML = "";
    data.lines.forEach(line => {
      const div = document.createElement("div");
      div.textContent = line.trim();
      logViewer.appendChild(div);
    });
  }

  function updateDownloadLink(logType) {
    downloadBtn.href = `/logs/download/${logType}`;
  }

  // Load initial log
  let currentLogType = "main";
  fetchLog(currentLogType);

  // On dropdown change
  logTypeSelect.addEventListener("change", () => {
    currentLogType = logTypeSelect.value;
    fetchLog(currentLogType);
    updateDownloadLink(currentLogType);
  });

  // Refresh button
  refreshBtn.addEventListener("click", () => {
    fetchLog(currentLogType);
  });
</script>
{% endblock %}
