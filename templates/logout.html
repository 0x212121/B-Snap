{% extends "base.html" %}
{% block title %}B-Snap — Logout{% endblock %}
{% block content %}
<div class="ui-card ui-card-body mx-auto max-w-lg">
  <h1 class="ui-page-title">Logout</h1>
  <p class="mt-3 text-gray-600 dark:text-gray-300">Confirm logout from this browser.</p>
  <form action="/logout" method="post" class="mt-4">
    <button type="submit" class="ui-button ui-button-primary">Logout</button>
    <a href="/maps" class="ui-button ui-button-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
