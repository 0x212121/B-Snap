{% import "_icons.html" as ui_icons %}
<!-- _action_buttons.html - Tailwind Version -->
{% if selected_camera %}
  {% if camera_exists %}
    <button data-action="snapshot" data-camera="{{ selected_camera }}" class="ui-button ui-button-primary">
      {{ ui_icons.icon_camera("w-5 h-5") }}
      Take Snapshot
    </button>
  {% endif %}
  
  <button data-action="delete-all" data-camera="{{ selected_camera }}" class="ui-button ui-button-danger">
    {{ ui_icons.icon_trash("w-5 h-5") }}
    Delete All
  </button>
{% endif %}
