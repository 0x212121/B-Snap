<!--
  This template renders the action buttons. It's only shown when a camera is selected.
-->
{% if selected_camera and role in ["admin", "operator"] %}
<button type="button" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 text-sm"
  data-action="snapshot" data-camera="{{ selected_camera }}">📸 Snapshot</button>
<button type="button" class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700 text-sm"
  data-action="delete-all" data-camera="{{ selected_camera }}">🗑️ Delete All</button>
{% endif %}
