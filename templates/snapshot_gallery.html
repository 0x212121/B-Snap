{% extends "base.html" %}
{% block title %}Gallery{% endblock %}

{% block content %}
<style>
  /* Add a subtle transition for the loading state */
  #snapshotGrid {
    transition: opacity 0.3s ease-in-out;
  }
  .lazy-img {
    filter: blur(10px);
    transition: filter 0.3s ease-out;
  }
  .lazy-img.loaded {
    filter: blur(0);
  }
  
  /* --- TomSelect Dark Mode Fix for Snapshot Gallery --- */
  /* Ensure these styles override default TomSelect styles for dark mode */
  .dark .ts-control {
    background-color: #1f2937 !important; /* Equivalent to dark:bg-gray-800 */
    border-color: #4b5563 !important;   /* Equivalent to dark:border-gray-600 */
    color: #f3f4f6 !important;          /* Text color for selected item/placeholder */
  }
  
  .dark .ts-wrapper.focus .ts-control,
  .dark .ts-wrapper.focus.input-active .ts-control {
    border-color: #3b82f6 !important; /* Equivalent to focus:ring-blue-500 */
    box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.5) !important; /* Equivalent to focus:ring-blue-500 */
  }
  
  .dark .ts-control input {
    color: #f3f4f6 !important; /* Ensures the typed input text is white */
  }
  
  .dark .ts-dropdown {
    background-color: #1f2937 !important; /* Dropdown background */
    border-color: #4b5563 !important;     /* Dropdown border */
  }
  
  .dark .ts-dropdown .option {
    color: #f3f4f6 !important; /* Dropdown option text color */
  }
  
  .dark .ts-dropdown .option.active {
    background-color: #374151 !important; /* Hover/active option background */
    color: #f3f4f6 !important;
  }
  
  /* Specific targeting for selected items if they appear with dark text */
  .dark .item {
    color: #f3f4f6 !important;
  }
  
  .peer:checked ~ span::before {
    content: "✔ ";
    color: #ef4444;
  }
  
</style>

<div class="container mx-auto px-4 py-8">
  <div id="toast" class="fixed top-5 right-5 z-50 hidden bg-green-500 text-white px-4 py-2 rounded shadow-md transition-all duration-300"></div>
  
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-3xl font-bold text-blue-700 dark:text-blue-300">📷 Snapshot Gallery</h1>
  </div>
  
  <form id="filterForm" class="flex flex-col md:flex-row justify-between gap-4 mb-6" onsubmit="return false;">
    <!-- Filter Controls -->
    <div class="flex flex-wrap items-center gap-4">
      <!-- Search input -->
      <input id="searchInput" type="text" placeholder="Search Camera Name..."
      class="px-4 py-2 rounded border border-gray-300 dark:border-gray-600 dark:bg-gray-800 dark:text-white text-sm w-64 focus:outline-none focus:ring focus:ring-blue-200" />
      
      <!-- Camera select -->
      <select id="cameraSelect" name="camera"
      class="rounded border border-gray-300 dark:border-gray-600 dark:bg-gray-800 dark:text-white text-sm w-[20rem] sm:w-[24rem] focus:outline-none">
      <option value="">🎥 All Cameras</option>
      {% for cname in camera_names | sort %}
      <option value="{{ cname }}" {% if cname == selected_camera %}selected{% endif %}>{{ cname }}</option>
      {% endfor %}
    </select>
    
    <!-- Clear filter -->
    <button type="button" id="clearFilterBtn"
    class="px-4 py-2 bg-gray-500 text-white rounded hover:bg-gray-600 text-sm">Clear Filter</button>
    
    <!-- Toggle switch -->
    <label for="filterTampered"
    class="flex items-center cursor-pointer select-none gap-2 text-sm text-gray-800 dark:text-gray-200">
    <input type="checkbox" id="filterTampered" class="sr-only peer">
    <div
    class="w-10 h-5 bg-gray-300 rounded-full peer-checked:bg-red-500 dark:bg-gray-600 dark:peer-checked:bg-red-600 relative transition-colors">
    <div
    class="absolute left-1 top-1 w-3 h-3 bg-white rounded-full peer-checked:translate-x-5 transform transition-transform">
  </div>
</div>
<span>Show Tampered Only</span>
</label>
</div>

<!-- Action Buttons -->
<div id="actionButtonsContainer" class="flex flex-wrap gap-4 items-center">
  {% if selected_camera %}
  {% if camera_exists %}
  <button type="button"
  class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 text-sm"
  data-action="snapshot" data-camera="{{ selected_camera }}">📸 Snapshot</button>
  {% endif %}
  <button type="button"
  class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700 text-sm"
  data-action="delete-all" data-camera="{{ selected_camera }}">🗑️ Delete All</button>
  {% endif %}
</div>
</form>


<div id="snapshotGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-3 gap-6">
  {% include "_gallery_grid.html" %}
</div>

<div id="modal" class="fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center hidden z-50">
  <div class="relative bg-white dark:bg-gray-800 p-4 rounded-lg shadow-lg max-w-4xl max-h-[80vh]">
    <div class="relative">
      <img id="modal-img" src="" class="rounded w-full object-contain max-h-[70vh]" />
      <div id="modal-info" class="absolute top-0 right-0 bg-black bg-opacity-60 text-white text-sm px-3 py-1 rounded shadow"></div>
    </div>
    <div class="flex justify-end mt-2 space-x-4">
      <a id="download-btn" href="#" download class="bg-blue-600 hover:bg-blue-700 text-white px-2 py-1 rounded">⬇️ Download</a>
      <button onclick="hideModal()" class="bg-red-600 hover:bg-red-700 text-white px-2 py-1 rounded">✖ Close</button>
    </div>
  </div>
</div>
</div>
{% endblock %}

{% block scripts %}
<link href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/js/tom-select.complete.min.js"></script>
<script>
  let tom;
  let debounceTimer;
  
  /**
  * Main function to fetch and update the gallery content via AJAX.
  * Fetches both the image grid and the action buttons from the /gallery-data endpoint.
  */
  const pageLimit = 15;
  let pageOffset = pageLimit;
  let isLoading = false;
  let hasMore = true;
  
  async function fetchAndUpdateGallery(params = {}, append = false) {
    // ⛔ FIX: Only check !hasMore when appending data for infinite scroll.
    if (isLoading || (append && !hasMore)) return;
    
    isLoading = true;
    const grid = document.getElementById("snapshotGrid");
    const actionButtonsContainer = document.getElementById("actionButtonsContainer");
    if (!append) {
      grid.style.opacity = '0.5';
      pageOffset = 0; // reset offset hanya jika bukan append
      hasMore = true;
    }
    
    const urlParams = new URLSearchParams();
    if (params.camera) urlParams.set('camera', params.camera);
    if (params.q) urlParams.set('q', params.q);
    
    const tamperedOnly = document.getElementById("filterTampered")?.checked;
    if (tamperedOnly) urlParams.set('tampered', 'true');
    
    urlParams.set('offset', pageOffset);
    urlParams.set('limit', pageLimit);
    
    try {
      const response = await fetch(`/gallery-data?${urlParams}`);
      if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
      const data = await response.json();
      
      if (append) {
        const tempDiv = document.createElement("div");
        tempDiv.innerHTML = data.html;
        [...tempDiv.children].forEach(child => grid.appendChild(child));
      } else {
        grid.innerHTML = data.html;
        actionButtonsContainer.innerHTML = data.buttons_html;
      }
      
      initializeLazyLoading();
      
      const numItems = (data.html.match(/snapshot-card/g) || []).length;
      if (data.html.trim() === "" || numItems < pageLimit) {
        hasMore = false;
      } else {
        pageOffset += pageLimit;
      }
      
    } catch (error) {
      console.error("Failed to update gallery:", error);
      showToast("Error updating gallery.", true);
    } finally {
      grid.style.opacity = '1';
      isLoading = false;
    }
  }
  
  let scrollTimer;
  window.addEventListener('scroll', () => {
    if (scrollTimer) clearTimeout(scrollTimer);
    scrollTimer = setTimeout(() => {
      if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 500) {
        const selectedCamera = tom?.getValue() || "";
        const searchQuery = document.getElementById("searchInput")?.value || "";
        fetchAndUpdateGallery({ camera: selectedCamera, q: searchQuery }, true);
      }
    }, 200); // delay 200ms
  });
  
  /**
  * Initializes TomSelect for the camera dropdown.
  */
  function initTomSelect() {
    if (tom) tom.destroy();
    tom = new TomSelect("#cameraSelect", {
      maxOptions: 100, // Increased max options
      allowEmptyOption: true,
      placeholder: 'Select a camera...',
      sortField: { field: "text", direction: "asc" },
      onChange: (value) => {
        const searchQuery = document.getElementById("searchInput").value;
        fetchAndUpdateGallery({ camera: value, q: searchQuery });
      }
    });
  }

  /**
  * Deletes a single snapshot by its ID.
  */
  function deleteSnapshot(snapshotId, element) { // atau deleteVideo(videoId, element)
    const card = element.closest('.snapshot-card'); // atau .video-card
    
    showGlobalConfirm("Are you sure you want to delete this item?", () => {
      card.style.opacity = '0.5';
      // Logika fetch Anda untuk menghapus item
      fetch(`/snap/${snapshotId}`, { method: 'DELETE' }) // atau /videos/${videoId}
      .then(res => res.json())
      .then(data => {
        if (data.status === "success") {
          showToast("Item deleted successfully");
          card.remove();
        } else {
          showToast(data.detail || "Failed to delete item", true);
          card.style.opacity = '1';
        }
      })
      .catch(err => {
        showToast("Error during deletion.", true);
        card.style.opacity = '1';
      });
    }, {
      title: '⚠️ Confirm Deletion',
      confirmText: 'Yes, Delete',
      confirmClasses: 'bg-red-600 hover:bg-red-700'
    });
  }
  // --- Event Listeners Setup ---
  document.addEventListener("DOMContentLoaded", () => {
    initTomSelect();
    initializeLazyLoading();
    
    document.getElementById("searchInput")?.addEventListener("input", (e) => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        const selectedCamera = tom?.getValue() || "";
        pageOffset = 0;
        hasMore = true;
        fetchAndUpdateGallery({ camera: selectedCamera, q: e.target.value });
      }, 350);
    })});
    
    document.getElementById("filterTampered")?.addEventListener("change", () => {
      const selectedCamera = tom?.getValue() || "";
      const searchQuery = document.getElementById("searchInput")?.value || "";
      pageOffset = 0;
      hasMore = true;
      fetchAndUpdateGallery({ camera: selectedCamera, q: searchQuery });
    });
    
    
    document.getElementById("clearFilterBtn")?.addEventListener("click", () => {
      document.getElementById("searchInput").value = '';
      tom.clear(); 
      
      const tampered = document.getElementById("filterTampered")?.checked;
      pageOffset = 0;
      hasMore = true;
      
      fetchAndUpdateGallery({ camera: "", q: "" });
    });
    
    
    // Event delegation for dynamically added action buttons
    document.getElementById("actionButtonsContainer").addEventListener("click", async (e) => {
      const target = e.target.closest("[data-action]");
      if (!target) return;

      // ⛔ FIX: cek disabled sebelum mengubah state tombol
      if (target.disabled) return;

      const action = target.dataset.action;
      const camera = target.dataset.camera;

      if (!camera) return;

      // ✅ baru di-set disable setelah validasi
      target.disabled = true;
      target.style.opacity = '0.7';

      try {
        if (action === "snapshot") {
          const res = await fetch(`/snap/${encodeURIComponent(camera)}`, { method: "POST" });
          const data = await res.json();

          if (data.status === "success") {
            showToast("Snapshot taken!");
            window.scrollTo({ top: 0, behavior: "smooth" });

            pageOffset = 0;
            hasMore = true;

            fetchAndUpdateGallery({
              camera: tom.getValue() || "",
              q: document.getElementById("searchInput").value || "",
              tampered: document.getElementById("filterTampered").checked
            });
          } else {
            showToast(data.message || "Snapshot failed", true);
          }
        }

        if (action === "delete-all") {
          if (!confirm(`Are you sure you want to delete all snapshots for ${camera}? This cannot be undone.`)) {
            return;
          }
          showToast("Delete-all functionality not yet implemented.", true);
        }

      } catch (error) {
        console.error(`Error performing action '${action}':`, error);
        showToast(`An error occurred.`, true);
      } finally {
        target.disabled = false;
        target.style.opacity = '1';
      }
    });
  
  // --- Utility and UI Functions ---
  
  function showToast(msg, isError = false) {
    const toast = document.getElementById("toast");
    toast.textContent = msg;
    toast.className = `fixed top-5 right-5 z-50 px-4 py-2 rounded shadow-md transition-all duration-300 ${isError ? "bg-red-500" : "bg-green-500"} text-white`;
    toast.classList.remove("hidden");
    setTimeout(() => toast.classList.add("hidden"), 3000);
  }
  
  function showModal(src, cameraName = '', timestamp = '') {
    const modal = document.getElementById("modal");
    const img = document.getElementById("modal-img");
    const info = document.getElementById("modal-info");
    const downloadBtn = document.getElementById("download-btn");
    
    img.src = src;
    info.textContent = `${cameraName} • ${timestamp}`;
    modal.classList.remove("hidden");
    
    // Set download link href and filename
    downloadBtn.href = src;
    downloadBtn.download = `snapshot_${cameraName}_${timestamp.replace(/[\s:]/g, '-')}.jpg`;
  }
  
  function hideModal() {
    document.getElementById("modal").classList.add("hidden");
  }
  
  function initializeLazyLoading() {
    const lazyImages = document.querySelectorAll('img.lazy-img:not(.loaded)');
    const observer = new IntersectionObserver((entries, obs) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const img = entry.target;
          img.src = img.src; // This triggers the load
          img.addEventListener('load', () => {
            img.classList.add('loaded');
          }, { once: true });
          obs.unobserve(img);
        }
      });
    }, { rootMargin: "0px 0px 200px 0px" }); // Start loading images 200px before they enter the viewport
    lazyImages.forEach(img => observer.observe(img));
  }  
  
</script>
{% endblock %}
