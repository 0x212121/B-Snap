{% extends "base.html" %}
{% block title %}API Docs{% endblock %}

{% block content %}
<!-- templates/swagger_embed.html -->
<head>
    <meta charset="UTF-8" />
    <title>Developer Docs</title>
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist/swagger-ui.css" />
    <script src="https://unpkg.com/swagger-ui-dist/swagger-ui-bundle.js"></script>
    <script src="https://unpkg.com/swagger-ui-dist/swagger-ui-standalone-preset.js"></script>
    
    <style>
        body {
            background-color: #111827; /* Tailwind dark: bg-gray-900 */
            color: #f9fafb !important;            /* Tailwind dark: text-gray-50 */
            font-family: ui-sans-serif, system-ui;
        }
        
        .dark th,
        .dark td,
        .dark td div,
        .dark p,
        .dark span,
        .dark li button,
        .dark .opblock-summary-description {
            color: #f9fafb !important; /* Tailwind's gray-50 */
        }

        .opblock-title span {
            color: #6b7280 !important;
        }
        
        .swagger-ui .topbar { display: none }
        
        .opblock-get .opblock-summary-method,
        .opblock-post .opblock-summary-method,
        .opblock-delete .opblock-summary-method {
            background-color: #6b7280 !important; /* gray-500 */
            color: #f9fafb !important;            /* gray-50 */
        }
    </style>
</head>

<body>
    <div id="swagger-ui"></div>
    <script>
        SwaggerUIBundle({
            url: "/openapi.json",
            dom_id: "#swagger-ui",
            deepLinking: true,
            presets: [SwaggerUIBundle.presets.apis],
            layout: "BaseLayout"
        });
    </script>
</body>

{% endblock %}
