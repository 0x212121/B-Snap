{% extends "base.html" %}
{% block title %}B-SNAP – Page Not Found{% endblock %}

{% block content %}
<div class="relative flex flex-col items-center justify-center min-h-[80vh] text-center overflow-hidden 
            bg-gray-50 dark:bg-gray-900 transition-colors duration-500">

  <!-- Static noise overlay -->
  <div class="absolute inset-0 opacity-[0.05] pointer-events-none"
       style="background-image: repeating-linear-gradient(0deg, #0001 0px, #0001 1px, transparent 2px);"
       class="dark:opacity-[0.03]"></div>

  <!-- Scanline shimmer -->
  <div class="absolute inset-0 pointer-events-none scanline-shimmer"></div>

  <!-- Blinking CCTV indicator -->
  <div class="absolute top-6 right-8 flex items-center gap-2 text-red-500 dark:text-red-400">
    <div class="w-3 h-3 rounded-full bg-red-500 animate-ping"></div>
    <span class="text-sm font-medium">REC</span>
  </div>

  <!-- Main content -->
  <div class="z-10 px-6">
    <div class="mb-10 text-blue-600 dark:text-blue-500 animate-pulse">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-32 h-32 mx-auto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <rect x="3" y="6" width="18" height="12" rx="2" ry="2" class="stroke-current"/>
        <circle cx="12" cy="12" r="3" class="stroke-current"/>
        <path d="M16 6V4M8 6V4M21 10h1M21 14h1" class="stroke-current"/>
      </svg>
    </div>

    <!-- Glitching 404 text -->
    <h1 class="relative text-[8rem] font-extrabold mb-4 leading-none tracking-tight drop-shadow-md 
               text-gray-900 dark:text-gray-100 select-none glitch-text">
      404
      <span aria-hidden="true">404</span>
      <span aria-hidden="true">404</span>
    </h1>

    <p class="text-2xl font-semibold text-gray-700 dark:text-gray-300 mb-3">Feed Not Found</p>
    <p class="text-gray-500 dark:text-gray-400 mb-10 text-base max-w-xl mx-auto">
      The CCTV feed you’re trying to access is unavailable.<br>
      It might have been disconnected, removed, or never existed.
    </p>

    <a href="/" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-8 py-3 rounded-xl shadow-lg 
                      transition-all flex items-center gap-2 justify-center">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
      </svg>
      Return to Dashboard
    </a>
  </div>

  <!-- Optional sound player -->
  <audio id="signalLost" preload="auto">
    <source src="/static/sounds/signal-lost.mp3" type="audio/mpeg">
  </audio>

  <!-- CSS animations -->
  <style>
    .glitch-text { position: relative; display: inline-block; }
    .glitch-text span { position: absolute; top: 0; left: 0; width: 100%; color: inherit; animation: glitch-light 3.5s infinite; }
    .glitch-text span:nth-child(2) { left: 2px; color: #00ffff80; clip-path: inset(0 0 50% 0); animation-delay: 0.2s; }
    .glitch-text span:nth-child(3) { left: -2px; color: #ff006680; clip-path: inset(50% 0 0 0); animation-delay: 0.4s; }

    @keyframes glitch-light {
      0%,100% { transform: translate(0); }
      20% { transform: translate(-1px, 1px); }
      40% { transform: translate(1px, -1px); }
      60% { transform: translate(-0.5px, 0.5px); }
      80% { transform: translate(0.5px, -0.5px); }
    }

    @media (prefers-color-scheme: dark) {
      .glitch-text span { animation: glitch-dark 1.8s infinite; }
    }
    @keyframes glitch-dark {
      0%,100% { transform: translate(0); }
      10% { transform: translate(-2px, 2px); }
      20% { transform: translate(2px, -2px); }
      40% { transform: translate(-1px, 1px); }
      60% { transform: translate(1px, -1px); }
      80% { transform: translate(-3px, 2px); }
    }

    .scanline-shimmer::before {
      content: "";
      position: absolute;
      top: -100%;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, transparent 0%, rgba(255,255,255,0.05) 50%, transparent 100%);
      animation: scanline 8s linear infinite;
    }
    @keyframes scanline { 0% { top: -100%; } 100% { top: 100%; } }
  </style>

  <!-- JS for one-time sound and mute toggle -->
  <script>
    const audio = document.getElementById('signalLost');
    const toggle = document.getElementById('soundToggle');
    window.addEventListener('load', () => {
      setTimeout(() => audio.play().catch(()=>{}), 600);
    });
  </script>
</div>
{% endblock %}
