{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto mt-16 px-6 py-8 bg-white dark:bg-gray-900 rounded-xl shadow-lg border border-gray-200 dark:border-gray-700">
  <h2 class="text-2xl font-semibold text-gray-900 dark:text-white mb-6 text-center">
    🔒 Change Your Password
  </h2>

  {% if error %}
  <div class="mb-4 p-3 rounded flex items-center space-x-2 bg-red-100 text-red-700 dark:bg-red-600 dark:text-white">
    <svg class="h-5 w-5 text-red-700 dark:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636L5.636 18.364M5.636 5.636L18.364 18.364"/>
    </svg>
    <span>{{ error }}</span>
  </div>
  {% endif %}
  
  {% if success %}
  <div class="mb-4 p-3 rounded flex items-center space-x-2 bg-green-100 text-green-700 dark:bg-green-600 dark:text-white">
    <svg class="h-5 w-5 text-green-700 dark:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
    </svg>
    <span>{{ success }}</span>
  </div>
  {% endif %}

  <form method="post" action="/change-password" class="space-y-6">

    <!-- Current Password -->
    <div>
      <label for="current_password" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Current Password</label>
      <div class="relative">
        <input type="password" name="current_password" id="current_password" required placeholder="Enter current password"
          class="w-full px-4 py-2 pr-10 rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500">
        <button type="button" onclick="toggleVisibility('current_password', this)"
          class="absolute inset-y-0 right-3 flex items-center text-gray-400 hover:text-gray-600 dark:hover:text-gray-300">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 eye-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 
              9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
          </svg>
        </button>
      </div>
    </div>

    <!-- New Password -->
    <div>
      <label for="new_password" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">New Password</label>
      <div class="relative">
        <input type="password" name="new_password" id="new_password" required placeholder="Min 8 characters"
          class="w-full px-4 py-2 pr-10 rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500"
          oninput="checkStrength()">
        <button type="button" onclick="toggleVisibility('new_password', this)"
          class="absolute inset-y-0 right-3 flex items-center text-gray-400 hover:text-gray-600 dark:hover:text-gray-300">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 eye-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 
              9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
          </svg>
        </button>
      </div>
      <!-- Strength bar -->
      <div class="mt-2 h-2 w-full bg-gray-200 dark:bg-gray-700 rounded overflow-hidden">
        <div id="strength_bar" class="h-full transition-all duration-300"></div>
      </div>
    </div>

    <!-- Confirm Password -->
    <div>
      <label for="confirm_password" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Confirm New Password</label>
      <div class="relative">
        <input type="password" name="confirm_password" id="confirm_password" required placeholder="Re-type new password"
          class="w-full px-4 py-2 pr-10 rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500">
        <button type="button" onclick="toggleVisibility('confirm_password', this)"
          class="absolute inset-y-0 right-3 flex items-center text-gray-400 hover:text-gray-600 dark:hover:text-gray-300">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 eye-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 
              9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
          </svg>
        </button>
      </div>
    </div>

    <button type="submit"
      class="w-full py-2 px-4 bg-blue-600 hover:bg-blue-700 transition-colors text-white font-semibold rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
      Update Password
    </button>
  </form>
<!-- 
  <div class="text-sm text-gray-500 dark:text-gray-400 text-center mt-6">
    Having trouble? <a href="/support" class="text-blue-600 hover:underline">Contact support</a>
  </div> -->
</div>

<!-- Scripts -->
<script>
  function toggleVisibility(fieldId, btn) {
    const input = document.getElementById(fieldId);
    const icon = btn.querySelector('svg');

    if (input.type === 'password') {
      input.type = 'text';
      icon.innerHTML = `
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M13.875 18.825A10.05 10.05 0 0112 19c-4.477 0-8.268-2.943-9.542-7a9.956 
          9.956 0 012.184-3.356M9.88 9.88a3 3 0 104.24 4.24M3 3l18 18" />
      `;
    } else {
      input.type = 'password';
      icon.innerHTML = `
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 
          9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
      `;
    }
  }

  function checkStrength() {
    const value = document.getElementById('new_password').value;
    const bar = document.getElementById('strength_bar');

    let strength = 0;
    if (value.length >= 8) strength += 1;
    if (/[a-z]/.test(value) && /[A-Z]/.test(value)) strength += 1;
    if (/\d/.test(value)) strength += 1;
    if (/[^A-Za-z0-9]/.test(value)) strength += 1;

    const colors = ['bg-red-500', 'bg-yellow-400', 'bg-blue-400', 'bg-green-500'];
    const widths = ['w-1/4', 'w-2/4', 'w-3/4', 'w-full'];

    bar.className = `transition-all duration-300 h-full rounded ${colors[strength - 1] || 'bg-gray-300'} ${widths[strength - 1] || 'w-0'}`;
  }
</script>
{% endblock %}
