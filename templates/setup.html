{% extends "base.html" %}
{% block content %}
<div class="container mx-auto py-8 max-w-lg">
  <h1 class="text-2xl font-bold mb-4">🛡️ Initial Admin Setup</h1>
  <form method="post">
    <label class="block mb-2 font-medium">Username</label>
    <input name="username" class="w-full p-2 border rounded mb-4 dark:text-gray-600" required />
    
    <label class="block mb-2 font-medium">Password</label>
    <input name="password" type="password" class="w-full p-2 border rounded mb-4 dark:text-gray-600" required />

    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded">Create Admin</button>
  </form>
</div>
{% endblock %}
