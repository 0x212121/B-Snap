<!DOCTYPE html>
<html lang="en" class="dark"> <!-- Tambahkan class dark jika ingin default dark mode -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Initial Admin Setup</title>
  <link rel="icon" type="image/x-icon" href="/static/icons/favicon.ico">
  <link href="/static/css/output.css" rel="stylesheet">
    <link href="/static/css/design-system.css" rel="stylesheet">
</head>
<body class="ui-auth bg-gray-50 text-gray-900 dark:bg-gray-900 dark:text-white transition-colors">

  <div class="container mx-auto py-16 max-w-lg px-6">
    <h1 class="ui-page-title text-3xl font-bold mb-6 text-center">🛡️ Initial Admin Setup</h1>

    <form method="post" class="ui-card ui-card-body space-y-6 bg-white dark:bg-gray-800 p-6 rounded-xl shadow">
      
      <div>
        <label for="username" class="ui-label block mb-1 font-medium">Username</label>
        <input id="username" name="username" required
          class="ui-control w-full p-2 rounded border border-gray-300 dark:border-gray-600 dark:bg-gray-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>
      
      <div>
        <label for="password" class="ui-label block mb-1 font-medium">Password</label>
        <input id="password" name="password" type="password" required
          class="ui-control w-full p-2 rounded border border-gray-300 dark:border-gray-600 dark:bg-gray-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>
      
      <button type="submit"
        class="ui-button ui-button-primary w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded transition">
        🚀 Create Admin
      </button>
    </form>
  </div>

</body>
</html>
