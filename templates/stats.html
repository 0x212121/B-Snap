{% extends "base.html" %}
{% block title %}Camera Statistics{% endblock %}

{% block content %}

<div class="container mx-auto px-4 py-8">
  <h1 class="text-3xl font-bold text-blue-700 dark:text-blue-300 mb-6">📈 Camera Snapshot Stats</h1>

  <div class="flex items-center gap-4 mb-6">
    <select id="cameraDropdown" class="border p-2 rounded dark:bg-gray-800 dark:text-white">
      <option value="">All Cameras</option>
      {% for name in camera_names %}
      <option value="{{ name | urlencode }}" {% if selected_camera == name %}selected{% endif %}>{{ name }}</option>
      {% endfor %}
    </select>
    <select id="periodDropdown" class="border p-2 rounded dark:bg-gray-800 dark:text-white">
      <option value="7" selected>Last 7 Days</option>
      <option value="14">Last 14 Days</option>
      <option value="30">Last 30 Days</option>
      <option value="90">Last 90 Days</option>
      <option value="365">Last Year</option>
    </select>
  </div>

  <div class="bg-white dark:bg-gray-800 p-6 rounded shadow mb-6">
    <canvas id="snapshotChart" height="100"></canvas>
  </div>

  <div id="noDataCamerasSection" class="bg-red-100 dark:bg-red-900 p-4 rounded shadow hidden">
    <h2 class="text-xl font-bold mb-2 text-red-700 dark:text-red-300">
      📛 Cameras Without Snapshots (<span id="totalNoDataCamerasCount">0</span>)
    </h2>
    <ul id="noDataCamerasList" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2 text-red-800 dark:text-red-100 list-disc list-inside">
    </ul>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
  let chartInstance;

  async function fetchStats(camera = "", days = 7) {
    const res = await fetch(`/stats/data?camera=${camera}&days=${days}`);
    const data = await res.json();

    updateChart(data.chart_labels, data.chart_data);
  }

  async function fetchNoDataCameras(days = 7, selectedCamera = "") {
    const res = await fetch(`/stats/no-data-cameras?days=${days}`);
    const data = await res.json();

    updateNoDataCameras(data.cameras, selectedCamera);
  }

  function updateChart(labels, values) {
    const ctx = document.getElementById('snapshotChart').getContext('2d');
    if (chartInstance) chartInstance.destroy();

    chartInstance = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [{
          label: 'Snapshots',
          data: values,
          backgroundColor: 'rgba(59, 130, 246, 0.7)',
          borderColor: 'rgba(59, 130, 246, 1)',
          borderWidth: 1
        }]
      },
      options: {
        responsive: true,
        scales: {
          x: { stacked: true },
          y: { stacked: true, beginAtZero: true }
        }
      }
    });
  }

  function updateNoDataCameras(cameras, selectedCamera) {
    const ul = document.getElementById('noDataCamerasList');
    const totalCountSpan = document.getElementById('totalNoDataCamerasCount');
    const noDataSection = document.getElementById('noDataCamerasSection');

    if (selectedCamera === "" && cameras.length > 0) {
      totalCountSpan.textContent = cameras.length;
      noDataSection.classList.remove('hidden');
      ul.innerHTML = "";
      cameras.forEach(cam => {
        const li = document.createElement("li");
        const statusColor = cam.status === "Online" ? "text-green-600 dark:text-green-400"
          : cam.status === "Offline" ? "text-red-600 dark:text-red-400"
          : "text-yellow-600 dark:text-yellow-300";

        li.innerHTML = `<span class="${statusColor} font-semibold">${cam.hostname}</span> - <span class="italic">${cam.status}</span>`;
        ul.appendChild(li);
      });
    } else {
      noDataSection.classList.add('hidden');
      ul.innerHTML = "";
    }
  }

  document.getElementById("cameraDropdown").addEventListener("change", (e) => {
    const selectedCamera = e.target.value;
    const selectedPeriod = document.getElementById("periodDropdown").value;
    fetchStats(selectedCamera, selectedPeriod);
    fetchNoDataCameras(selectedPeriod, selectedCamera);
  });

  document.getElementById("periodDropdown").addEventListener("change", (e) => {
    const selectedCamera = document.getElementById("cameraDropdown").value;
    fetchStats(selectedCamera, e.target.value);
    fetchNoDataCameras(e.target.value, selectedCamera);
  });

  // Initial load
  const initialSelectedCamera = document.getElementById("cameraDropdown").value;
  const initialSelectedPeriod = document.getElementById("periodDropdown").value;
  fetchStats(initialSelectedCamera, initialSelectedPeriod);
  fetchNoDataCameras(initialSelectedPeriod, initialSelectedCamera);
</script>

{% endblock %}
