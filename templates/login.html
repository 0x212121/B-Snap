<!DOCTYPE html>
<html>
<head>
    <title>Login | B-Snap</title>
    <link href="/static/css/output.css" rel="stylesheet">
</head>
<body class="bg-gray-900 flex items-center justify-center h-screen">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <img src="/static/icons/favicon-white.ico" alt="Logo" class="w-16 h-16 mx-auto mb-4">
            <h1 class="text-2xl font-bold text-white">CCTV Snapper</h1>
            <p class="text-gray-400 mt-2">Administrator Access</p>
        </div>
        <form method="post" action="/login" class="bg-gray-800 p-8 rounded-xl shadow-lg">
            <h2 class="text-xl font-bold mb-6 text-center text-white">🔐 Admin Login</h2>
            {% if error %}
                <div class="bg-red-900/50 border border-red-700 text-red-200 px-4 py-3 rounded mb-4 text-sm">
                    {{ error }}
                </div>
            {% endif %}
            <div class="space-y-4">
                <div>
                    <label class="block text-gray-300 text-sm font-medium mb-2">Username</label>
                    <input name="username" type="text" placeholder="Enter your username" required 
                        class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition" />
                </div>
                <div>
                    <label class="block text-gray-300 text-sm font-medium mb-2">Password</label>
                    <input name="password" type="password" placeholder="Enter your password" required 
                        class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition" />
                </div>
            </div>
            <button type="submit" 
                class="w-full mt-6 bg-blue-600 text-white py-3 rounded-lg font-medium hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 focus:ring-offset-gray-800 transition">
                Sign In
            </button>
        </form>
    </div>
</body>
</html>
